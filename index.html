<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión Amedel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--n:#0a0a0a;--g1:#fafafa;--g2:#f0f0f0;--g3:#e5e5e5;--g4:#d4d4d4;--g5:#8a8a8a;--t2:#5c5c5c;--rojo:#a61b12;--rojo-bg:#fdecea;--ambar:#92400e;--ambar-bg:#fef3c7;--verde:#166534}
body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;color:var(--n);background:var(--g1)}
h1,h2,h3,p{margin:0}h1{font:700 28px/1.2 Poppins,Inter,sans-serif}h2{font-size:16px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:flex;min-height:100vh}
.side{width:232px;flex:none;background:var(--n);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.logo{font:700 22px Poppins,Inter,sans-serif;letter-spacing:.06em;padding:0 8px;text-transform:uppercase}
.side a.it{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:44px;border-radius:6px;color:#c4c4c4;text-decoration:none;font-weight:500}
.side a.it.on{background:#262626;color:#fff}
.badge{margin-left:auto;background:#fff;color:var(--n);border-radius:99px;padding:1px 8px;font-size:12px;font-weight:600}
main{flex:1;min-width:0;padding:32px 40px 48px;display:flex;flex-direction:column;gap:20px}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--n);border-radius:6px;background:var(--n);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--n)}
.btn.gh{border-color:transparent;background:transparent;color:var(--t2);text-decoration:underline;font-weight:500;padding:0 8px}
.btn.bl{background:#fff;color:var(--n);border-color:#fff}
.btn:disabled{background:var(--g2);color:var(--t2);border-color:var(--g5);cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.card{background:#fff;border:1px solid var(--g3);border-radius:6px;padding:16px 20px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}.end{justify-content:flex-end}
.col{display:flex;flex-direction:column;gap:10px}
.mut{color:var(--t2);font-size:12px}
.tag{font-size:12px;color:var(--t2);border:1px solid var(--g4);border-radius:4px;padding:1px 7px;white-space:nowrap}
.chip{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;border:1px solid var(--n);white-space:nowrap;background:#fff}
.e-proceso{background:var(--g3);border-color:var(--g3)}.e-revision{background:var(--n);color:#fff}.e-bloqueada{background:var(--rojo-bg);color:var(--rojo);border-color:var(--rojo)}.e-completada{color:var(--t2);border-color:var(--g4)}
select.chip{min-height:32px;cursor:pointer}
select.chip option{background:#fff;color:var(--n)}
.due{font-size:12px;font-weight:600;border-radius:4px;padding:2px 7px;background:#f5f5f5;color:var(--t2);white-space:nowrap}
.due.soon{background:var(--ambar-bg);color:var(--ambar)}.due.late{background:var(--rojo-bg);color:var(--rojo)}
.alta{font-size:12px;font-weight:600;color:var(--ambar);background:var(--ambar-bg);border-radius:4px;padding:2px 7px;white-space:nowrap}
.av{width:28px;height:28px;flex:none;border-radius:50%;background:var(--n);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.av.no{background:#fff;color:var(--t2);border:1px dashed var(--g5)}
.cnt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cnt .card{padding:14px 16px}.cnt b{display:block;font:700 32px/1.1 Poppins,Inter,sans-serif}.cnt span{font-size:13px;color:var(--t2)}
.cnt .r{border-color:var(--rojo)}.cnt .r b,.cnt .r span{color:var(--rojo)}.cnt .v b{color:var(--verde)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #efefef}
.tt{flex:1 1 220px;min-width:0;font-weight:500;cursor:pointer;background:none;border:0;text-align:left;padding:6px 0}
.tt.done{color:var(--t2);text-decoration:line-through}
.tt2{flex:1 1 200px;min-width:0;font-weight:500}
.kan{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:14px;overflow-x:auto;align-items:start;padding-bottom:8px}
.kcol{background:var(--g2);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.kcol h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;padding:2px 4px}
.kc{background:#fff;border:1px solid var(--g3);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.kc.blq,.kc.late{border-color:var(--rojo)}
.kc b{font-weight:600;line-height:1.35}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.in{min-height:44px;padding:8px 12px;border:1px solid var(--g4);border-radius:6px;background:#fff;font-weight:400;width:100%}
textarea.in{min-height:80px;resize:vertical}
.tabs{display:flex;flex-wrap:wrap;gap:20px;border-bottom:1px solid var(--g3)}
.tab{min-height:44px;border:0;border-bottom:2px solid transparent;background:none;color:var(--t2);font-weight:500;cursor:pointer;padding:0 2px}
.tab.on{border-color:var(--n);color:var(--n);font-weight:700}
.pill{min-height:36px;padding:0 12px;border:1px solid var(--g4);border-radius:99px;background:#fff;cursor:pointer;font-size:13px}
.pill.on{background:var(--n);color:#fff;border-color:var(--n);font-weight:600}
.fsel{min-height:36px;padding:0 8px;border:1px dashed var(--g5);border-radius:6px;background:#fff;font-size:13px;max-width:170px}
.seg{display:inline-flex;border:1px solid var(--n);border-radius:6px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;border:0;background:#fff;font-weight:600;cursor:pointer}.seg button.on{background:var(--n);color:#fff}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;border-left:1px solid var(--n);padding:20px;overflow-y:auto;z-index:20;display:flex;flex-direction:column;gap:14px;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:#fff;border-radius:8px;padding:20px;width:min(520px,100%);max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:6px;z-index:40;max-width:90vw}
.bar{height:6px;background:var(--g3);border-radius:99px}.bar i{display:block;height:6px;background:var(--n);border-radius:99px}
.navm,.fab{display:none}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--n);padding:24px}
.sec-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t2)}
.dark{background:var(--n);color:#fff;border-color:var(--n)}.dark .mut{color:#d4d4d4}
.warn{font-weight:600;color:var(--ambar);background:var(--ambar-bg);border-radius:6px;padding:6px 10px;font-size:13px}
.err{color:var(--rojo);font-size:13px}
.chk{display:inline-flex;align-items:center;gap:6px;font-weight:400;min-height:32px;margin-right:10px}
.x{width:44px;height:44px;border:0;background:none;font-size:22px;cursor:pointer}
@media(max-width:860px){
.side{display:none}main{padding:20px 16px 150px}h1{font-size:24px}
.navm{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--n);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
.navm a{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#b8b8b8;font-size:11px;text-decoration:none}
.navm a.on{color:#fff;font-weight:700}
.fab{display:flex;position:fixed;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--n);color:#fff;border:2px solid #fff;align-items:center;justify-content:center;font-size:28px;z-index:11;cursor:pointer}
.cnt{gap:6px}.cnt .card{padding:8px 4px;text-align:center}.cnt b{font-size:22px}.cnt span{font-size:11px}
.grid2{grid-template-columns:1fr}
.btn.sm,.pill,.fsel{min-height:44px}select.chip{min-height:40px}
.ov{align-items:flex-end;padding:0}.md{border-radius:16px 16px 0 0;width:100%}
}
</style>
</head>
<body>
<div id="app"><p style="padding:24px">Cargando…</p></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ============ CONFIGURACIÓN ============
   Con los dos datos de Supabase vacíos la app funciona en MODO LOCAL
   (los datos quedan solo en este navegador). Completalos para que
   todo el equipo comparta los datos y entre con Google. Ver README. */
const CONFIG = {
  SUPABASE_URL: 'https://iiuyjzgiadxcndoxyyzf.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_97xqkdYfBREh4bcHGG1EZg_30gH23FU',
  CLIENTE: 'Amedel'
};
/* ======================================= */

const NUBE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const LS = 'amedel_gestion_v1', LS_YO = 'amedel_yo', LS_F = 'amedel_filtros';
const ESTADOS = [['pendiente','Pendiente'],['proceso','En proceso'],['revision','En revisión'],['bloqueada','Bloqueada'],['completada','Completada']];
const PRIOS = [['alta','Alta'],['media','Media'],['baja','Baja']];
const TIPOS_NOTA = [['tema','Temas'],['pedido','Pedidos'],['acuerdo','Acuerdos'],['observacion','Observaciones'],['paso','Próximos pasos']];
const TABS_P = [['nuevo','Nuevos'],['evaluacion','En evaluación'],['convertido','Convertidos'],['descartado','Descartados']];
const ICO = {
  inicio:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  tareas:'M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v6h-4z',
  pedidos:'M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5',
  reuniones:'M5 4h14v17H5zM9 9h6M9 13h6M9 17h3',
  equipo:'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.4M18 14.8c1.9.8 3.1 2.6 3.5 5.2'
};
const SEC = [['inicio','Inicio'],['tareas','Tareas'],['pedidos','Pedidos'],['reuniones','Reuniones'],['equipo','Equipo']];

/* ---------- utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoy = () => ymd(new Date());
const ahora = () => new Date().toISOString();
const addDias = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const fFecha = s => s ? Number(s.slice(8, 10)) + '/' + Number(s.slice(5, 7)) : '';
const fHora = iso => { const d = new Date(iso); return d.getDate() + '/' + (d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const byNom = (a, b) => (a.nombre || '').localeCompare(b.nombre || '');
const ini = n => (n || '?').trim().split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
const svg = k => `<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${ICO[k]}"/></svg>`;
function aviso(msg) { const t = $('#toast'); t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(aviso.t); aviso.t = setTimeout(() => t.innerHTML = '', 3500); }

/* ---------- datos ---------- */
let sb = null, sesion = null, yo = null;
const store = {
  recs: new Map(),
  all(tipo) { return [...this.recs.values()].filter(r => r.tipo === tipo); },
  get(id) { return this.recs.get(id); },
  save(rec) {
    if (!rec.id) rec.id = uid();
    this.recs.set(rec.id, rec); programar();
    backend.upsert(rec).catch(e => aviso('No se pudo guardar: ' + (e.message || e)));
    return rec;
  },
  remove(id) {
    this.recs.delete(id); programar();
    backend.remove(id).catch(e => aviso('No se pudo borrar: ' + (e.message || e)));
  }
};
const local = {
  async load() { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch (e) { return []; } },
  async upsert() { this.flush(); },
  async remove() { this.flush(); },
  flush() { localStorage.setItem(LS, JSON.stringify([...store.recs.values()])); }
};
const nube = {
  async load() {
    const out = [];
    for (let i = 0; ; i += 1000) {
      const { data, error } = await sb.from('registros').select('id,tipo,datos').order('id').range(i, i + 999);
      if (error) throw error;
      data.forEach(r => out.push({ ...r.datos, id: r.id, tipo: r.tipo }));
      if (data.length < 1000) break;
    }
    return out;
  },
  async upsert(rec) {
    const { id, tipo, ...datos } = rec;
    const { error } = await sb.from('registros').upsert({ id, tipo, datos, actualizado: ahora() });
    if (error) throw error;
  },
  async remove(id) { const { error } = await sb.from('registros').delete().eq('id', id); if (error) throw error; },
  escuchar() {
    sb.channel('registros').on('postgres_changes', { event: '*', schema: 'public', table: 'registros' }, p => {
      if (p.eventType === 'DELETE') store.recs.delete(p.old.id);
      else store.recs.set(p.new.id, { ...p.new.datos, id: p.new.id, tipo: p.new.tipo });
      render(true);
    }).subscribe();
  }
};
const backend = NUBE ? nube : local;

/* ---------- helpers de dominio ---------- */
const P = id => store.get(id);
const nom = id => (P(id) || {}).nombre || '';
const av = id => id && P(id) ? `<span class="av" title="${esc(nom(id))}">${esc(ini(nom(id)))}</span>` : `<span class="av no" title="Sin asignar">–</span>`;
const eLabel = e => (ESTADOS.find(x => x[0] === e) || [e, e])[1];
const opts = (list, sel, vacio) => (vacio != null ? `<option value="">${esc(vacio)}</option>` : '') + list.map(([v, l]) => `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(l)}</option>`).join('');
const personasO = () => store.all('persona').sort(byNom).map(p => [p.id, p.nombre]);
const areasO = () => store.all('area').sort(byNom).map(a => [a.id, a.nombre]);
const campO = sel => store.all('campana').filter(c => c.estado !== 'cerrada' || c.id === sel).sort(byNom).map(c => [c.id, c.nombre]);
const PR = { alta: 0, media: 1, baja: 2 };
const ordT = (a, b) => (a.vence || '9999').localeCompare(b.vence || '9999') || PR[a.prioridad] - PR[b.prioridad] || a.titulo.localeCompare(b.titulo);
const tareasDe = id => store.all('tarea').filter(t => t.origen && t.origen.id === id);
const pendNotas = rid => store.all('nota').filter(n => n.reunionId === rid && n.estado === 'pendiente').length;

function dueChip(t) {
  if (!t.vence) return '';
  const h = hoy();
  if (t.estado === 'completada') return `<span class="due">${fFecha(t.vence)}</span>`;
  if (t.vence < h) return `<span class="due late">Vencida ${fFecha(t.vence)}</span>`;
  if (t.vence <= addDias(h, 2)) return `<span class="due soon">Vence ${t.vence === h ? 'hoy' : t.vence === addDias(h, 1) ? 'mañana' : fFecha(t.vence)}</span>`;
  return `<span class="due">${fFecha(t.vence)}</span>`;
}
function origenTxt(t) {
  const o = t.origen || {};
  if (o.tipo === 'pedido') { const p = P(o.id); return 'Pedido ' + (p && p.origenTipo === 'interno' ? 'interno' : 'del cliente'); }
  if (o.tipo === 'nota') { const n = P(o.id), r = n && P(n.reunionId); return r ? 'Reunión ' + fFecha(r.fecha) : 'Reunión'; }
  return 'Iniciativa interna';
}
const selEstado = t => `<select class="chip e-${t.estado}" data-c="estado" data-id="${t.id}" aria-label="Estado de la tarea">${opts(ESTADOS, t.estado)}</select>`;
const fila = t => `<div class="li"><button type="button" class="tt${t.estado === 'completada' ? ' done' : ''}" data-a="abrir" data-id="${t.id}">${esc(t.titulo)}</button>${t.areaId && P(t.areaId) ? `<span class="tag">${esc(nom(t.areaId))}</span>` : ''}${t.prioridad === 'alta' && t.estado !== 'completada' ? '<span class="alta">Alta</span>' : ''}${dueChip(t)}${selEstado(t)}${av(t.responsableId)}</div>`;

function log(t, texto) { store.save({ tipo: 'comentario', tareaId: t.id, autor: yo.id, fecha: ahora(), texto, auto: true }); }
function crearTarea(d) {
  const t = { tipo: 'tarea', id: uid(), titulo: d.titulo.trim(), descripcion: d.descripcion || '', areaId: d.areaId || '', responsableId: d.responsableId || '', colaboradores: [], estado: 'pendiente', prioridad: d.prioridad || 'media', vence: d.vence || '', campanaId: d.campanaId || '', creadoPor: yo.id, creado: ahora(), origen: d.origen || { tipo: 'interno' }, bloqueo: '' };
  store.save(t); log(t, 'creó la tarea'); return t;
}
function aplicarEstado(t, nuevo, motivo) {
  const antes = t.estado;
  t.estado = nuevo; t.bloqueo = nuevo === 'bloqueada' ? motivo : '';
  t.completada = nuevo === 'completada' ? hoy() : '';
  store.save(t);
  log(t, `pasó la tarea de ${eLabel(antes)} a ${eLabel(nuevo)}` + (motivo ? `: ${motivo}` : ''));
}
function cambiarEstado(t, nuevo) {
  if (!t || t.estado === nuevo) return;
  if (nuevo === 'bloqueada') {
    return modal('¿Qué la traba?', `<label class="fld">Motivo del bloqueo<input class="in" name="motivo" required maxlength="200" placeholder="Una línea con lo que falta"></label>`, d => {
      if (!d.motivo.trim()) return false; aplicarEstado(t, nuevo, d.motivo.trim());
    }, 'Bloquear');
  }
  if (nuevo !== 'pendiente' && !t.responsableId) {
    return modal('Falta responsable', `<p>Para avanzar, la tarea necesita un responsable.</p><label class="fld">Responsable<select class="in" name="resp" required>${opts(personasO(), yo.id)}</select></label>`, d => {
      t.responsableId = d.resp; log(t, `asignó a ${nom(d.resp)} como responsable`); aplicarEstado(t, nuevo);
    }, 'Asignar y mover');
  }
  aplicarEstado(t, nuevo);
}
function bandeja() {
  return [
    ...store.all('pedido').map(p => ({ r: p, estado: p.estado, fecha: p.creado })),
    ...store.all('nota').filter(n => n.clase === 'pedido').map(n => ({ r: n, estado: n.estado === 'pendiente' ? 'nuevo' : n.estado === 'con_tarea' ? 'convertido' : 'descartado', fecha: n.creado }))
  ].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
}
const sinResolver = () => bandeja().filter(x => x.estado === 'nuevo' || x.estado === 'evaluacion');
function marcarConvertido(r) { r.estado = r.tipo === 'nota' ? 'con_tarea' : 'convertido'; store.save(r); }

/* ---------- estado de interfaz ---------- */
const movil = () => window.matchMedia ? window.matchMedia('(max-width:860px)').matches : false;
const F0 = { resp: '', area: '', estado: '', prio: '', camp: '', fecha: '' };
const ui = { vista: movil() ? 'lista' : 'kanban', grupo: 'estado', f: { ...F0 }, q: '', tab: 'nuevo', tarea: null, foco: null };
const ruta = () => { const p = (location.hash || '').replace(/^#\/?/, '').split('/'); return SEC.some(s => s[0] === p[0]) || p[0] === 'reunion' ? p : ['inicio']; };
const filtrosGuardados = () => { try { return JSON.parse(localStorage.getItem(LS_F) || '[]'); } catch (e) { return []; } };
function presets() {
  return [['Todo', { ...F0 }], ['Lo mío', { ...F0, resp: yo.id }], ['Bloqueadas', { ...F0, estado: 'bloqueada' }], ['Vence esta semana', { ...F0, fecha: 'semana' }], ...filtrosGuardados().map(x => [x.nombre, x.f, true])];
}
function filtradas(ignorarEstado) {
  const f = ui.f, h = hoy(), q = ui.q.toLowerCase();
  return store.all('tarea').filter(t =>
    (!f.resp || (f.resp === '_no' ? !t.responsableId : t.responsableId === f.resp)) &&
    (!f.area || t.areaId === f.area) && (ignorarEstado || !f.estado || t.estado === f.estado) &&
    (!f.prio || t.prioridad === f.prio) && (!f.camp || t.campanaId === f.camp) &&
    (!f.fecha || (f.fecha === 'sin' ? !t.vence : f.fecha === 'vencidas' ? (t.vence && t.vence < h && t.estado !== 'completada') : (t.vence && t.vence >= h && t.vence <= addDias(h, 7)))) &&
    (!q || t.titulo.toLowerCase().includes(q))).sort(ordT);
}

  const cs = store.all('comentario').filter(c => c.tareaId === t.id).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const campo = (k, html) => html.replace('<select', `<select data-c="campo" data-k="${k}" data-id="${t.id}"`).replace('<input', `<input data-c="campo" data-k="${k}" data-id="${t.id}"`).replace('<textarea', `<textarea data-c="campo" data-k="${k}" data-id="${t.id}"`);
  return `<aside class="drawer" aria-label="Detalle de la tarea">
<div class="row between"><span class="mut">Tarea${t.campanaId && P(t.campanaId) ? ' · ' + esc(nom(t.campanaId)) : ''}</span><button type="button" class="x" data-a="cerrarDrawer" aria-label="Cerrar detalle">×</button></div>
${campo('titulo', `<input class="in" style="font:700 18px Poppins,Inter,sans-serif" value="${esc(t.titulo)}" aria-label="Título">`)}
<div class="row">${selEstado(t)}${dueChip(t)}${t.prioridad === 'alta' ? '<span class="alta">Prioridad alta</span>' : ''}</div>
${t.bloqueo ? `<p class="err"><b>Traba:</b> ${esc(t.bloqueo)}</p>` : ''}
<div class="g2">
<label class="fld">Responsable${campo('responsableId', `<select class="in">${opts(personasO(), t.responsableId, 'Sin asignar')}</select>`)}</label>
<label class="fld">Área${campo('areaId', `<select class="in">${opts(areasO(), t.areaId, 'Sin área')}</select>`)}</label>
<label class="fld">Prioridad${campo('prioridad', `<select class="in">${opts(PRIOS, t.prioridad)}</select>`)}</label>
<label class="fld">Vencimiento${campo('vence', `<input class="in" type="date" value="${esc(t.vence)}">`)}</label></div>
<label class="fld">Campaña${campo('campanaId', `<select class="in">${opts(campO(t.campanaId), t.campanaId, 'Sin campaña')}</select>`)}</label>
<div class="fld">Colaboradores<div>${store.all('persona').sort(byNom).filter(p => p.id !== t.responsableId).map(p => `<label class="chk"><input type="checkbox" data-c="colab" data-id="${t.id}" value="${p.id}"${(t.colaboradores || []).includes(p.id) ? ' checked' : ''}>${esc(p.nombre)}</label>`).join('') || '<span class="mut">No hay más personas en el equipo.</span>'}</div></div>
<label class="fld">Descripción${campo('descripcion', `<textarea class="in" placeholder="Detalle, enlaces, lo que haga falta">${esc(t.descripcion)}</textarea>`)}</label>
<button type="button" class="card row between" style="background:#f5f5f5;border:0;cursor:pointer;text-align:left" data-a="irOrigen" data-id="${t.id}"><span><span class="sec-t">Origen</span><br><b>${esc(origenTxt(t))}</b></span><span aria-hidden="true">›</span></button>
<section class="col"><h2>Comentarios</h2>${cs.filter(c => !c.auto).map(c => `<div class="row" style="align-items:flex-start;flex-wrap:nowrap">${av(c.autor)}<div><span class="mut">${esc(nom(c.autor))} · ${fHora(c.fecha)}</span><br><span style="white-space:pre-wrap">${esc(c.texto)}</span></div></div>`).join('') || vacio('Sin comentarios todavía.')}
<form class="row" style="flex-wrap:nowrap" data-s="comentario" data-id="${t.id}"><input class="in" id="coment" name="texto" placeholder="Escribí un comentario" aria-label="Comentario" required><button class="btn">Enviar</button></form></section>
<section class="col" style="gap:4px"><h2>Historial</h2>${cs.filter(c => c.auto).reverse().map(c => `<span class="mut">${esc(nom(c.autor))} ${esc(c.texto)} · ${fHora(c.fecha)}</span>`).join('')}
<span class="mut">Creada por ${esc(nom(t.creadoPor) || 'alguien')} · ${fHora(t.creado)}</span></section>
<button type="button" class="btn gh sm" style="align-self:flex-start;color:var(--rojo)" data-a="eliminarTarea" data-id="${t.id}">Eliminar tarea</button></aside>`;
}

/* ---------- modales ---------- */
function cerrarModal() { $('#modal').innerHTML = ''; programar(); }
function modal(titulo, cuerpo, onOk, okLabel) {
  $('#modal').innerHTML = `<div class="ov" data-a="cerrarModal"><form class="md" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><h2 style="font-size:18px">${esc(titulo)}</h2>${cuerpo}<div class="row end"><button type="button" class="btn sec" data-a="cerrarModal">Cancelar</button><button class="btn">${esc(okLabel || 'Guardar')}</button></div></form></div>`;
  const f = $('#modal form');
  f.onsubmit = e => { e.preventDefault(); if (onOk(Object.fromEntries(new FormData(f)), f) !== false) cerrarModal(); };
  const p = f.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=hidden]),textarea,select'); if (p) p.focus();
  return f;
}
function camposTarea(pre) {
  pre = pre || {};
  return `<label class="fld">Título<input class="in" name="titulo" required maxlength="200" value="${esc(pre.titulo || '')}"></label>
<div class="g2"><label class="fld">Área<select class="in" name="areaId">${opts(areasO(), pre.areaId, 'Sin área')}</select></label>
<label class="fld">Responsable<select class="in" name="responsableId">${opts(personasO(), pre.responsableId, 'Sin asignar')}</select></label>
<label class="fld">Prioridad<select class="in" name="prioridad">${opts(PRIOS, pre.prioridad || 'media')}</select></label>
<label class="fld">Vencimiento<input class="in" type="date" name="vence" value="${esc(pre.vence || '')}"></label></div>
<label class="fld">Campaña<select class="in" name="campanaId">${opts(campO(pre.campanaId), pre.campanaId, 'Sin campaña')}</select></label>
<p class="mut">Solo el título es obligatorio. Lo demás se puede completar después.</p>`;
}
function modalTarea(titulo, pre, extra, onOk) {
  modal(titulo, (extra || '') + camposTarea(pre), d => { if (!d.titulo.trim()) return false; onOk(d); }, 'Guardar tarea');
}
function origenDe(r) { return { tipo: r.tipo, id: r.id }; }
function infoOrigen(r) {
  const reu = r.tipo === 'nota' && P(r.reunionId);
  return `<p class="mut" style="background:#f5f5f5;border-radius:6px;padding:8px 10px">Origen: <b>${r.tipo === 'nota' ? 'Reunión ' + (reu ? fFecha(reu.fecha) : '') : 'Pedido'}</b>. La tarea queda enlazada y el original no se modifica.</p>`;
}
function modalCargar() {
  const rs = store.all('reunion').filter(r => r.estado !== 'cerrada').sort((a, b) => b.fecha.localeCompare(a.fecha));
  const f = modal('Cargar', `<div class="seg" role="group" aria-label="Qué querés cargar">${[['tarea', 'Tarea'], ['pedido', 'Pedido'], ['nota', 'Nota']].map(([v, l], i) => `<button type="button" data-clase="${v}" class="${i ? '' : 'on'}"${v === 'nota' && !rs.length ? ' disabled title="No hay reuniones abiertas"' : ''}>${l}</button>`).join('')}</div>
<input type="hidden" name="clase" value="tarea"><label class="fld"><span id="lbl-texto">Título de la tarea</span><input class="in" name="texto" required maxlength="300"></label>
<div data-solo="tarea" class="g2"><label class="fld">Responsable<select class="in" name="responsableId">${opts(personasO(), '', 'Sin asignar')}</select></label><label class="fld">Vencimiento<input class="in" type="date" name="vence"></label></div>
<label class="fld" data-solo="pedido" hidden>Origen<select class="in" name="origen"><option value="cliente">Pedido del cliente</option><option value="interno">Iniciativa interna</option></select></label>
<div data-solo="nota" class="g2" hidden><label class="fld">Reunión<select class="in" name="reunionId">${opts(rs.map(r => [r.id, fFecha(r.fecha) + (r.motivo ? ' · ' + r.motivo : '')]), rs[0] && rs[0].id)}</select></label><label class="fld">Tipo<select class="in" name="tipoNota">${opts(TIPOS_NOTA.map(([v, l]) => [v, l]), 'acuerdo')}</select></label></div>
<p class="mut">Solo el texto es obligatorio.</p>`, d => {
    const texto = d.texto.trim(); if (!texto) return false;
    if (d.clase === 'tarea') crearTarea({ titulo: texto, responsableId: d.responsableId, vence: d.vence });
    else if (d.clase === 'pedido') store.save({ tipo: 'pedido', texto, origenTipo: d.origen, estado: 'nuevo', cargadoPor: yo.id, creado: ahora() });
    else store.save({ tipo: 'nota', reunionId: d.reunionId, clase: d.tipoNota, texto, autor: yo.id, estado: 'pendiente', creado: ahora() });
    aviso('Cargado');
  });
  f.addEventListener('click', e => {
    const b = e.target.closest('[data-clase]'); if (!b) return;
    f.elements.clase.value = b.dataset.clase;
    f.querySelectorAll('[data-clase]').forEach(x => x.classList.toggle('on', x === b));
    f.querySelectorAll('[data-solo]').forEach(x => x.hidden = x.dataset.solo !== b.dataset.clase);
    $('#lbl-texto', f).textContent = { tarea: 'Título de la tarea', pedido: 'Qué se pidió', nota: 'Nota de minuta' }[b.dataset.clase];
  });
}

/* ---------- acciones ---------- */
const acc = {
  cerrarModal(el, e) { if (e.target === el) cerrarModal(); },
  cargar() { modalCargar(); },
  abrir(el) { ui.tarea = el.dataset.id; render(); },
  cerrarDrawer() { ui.tarea = null; render(); },
  vista(el) { ui.vista = el.dataset.v; render(); },
  tab(el) { ui.tab = el.dataset.k; render(); },
  preset(el) { ui.f = { ...presets()[el.dataset.i][1] }; render(); },
  guardarFiltro() { modal('Guardar filtro', `<label class="fld">Nombre del filtro<input class="in" name="nombre" required maxlength="30"></label>`, d => { const l = filtrosGuardados().filter(x => x.nombre !== d.nombre.trim()); l.push({ nombre: d.nombre.trim(), f: { ...ui.f } }); localStorage.setItem(LS_F, JSON.stringify(l)); }); },
  borrarFiltro(el) { localStorage.setItem(LS_F, JSON.stringify(filtrosGuardados().filter(x => x.nombre !== el.dataset.n))); render(); },
  nuevaTarea() { modalTarea('Nueva tarea', { campanaId: ui.f.camp, areaId: ui.f.area }, '', d => crearTarea(d)); },
  eliminarTarea(el) { if (!confirm('¿Eliminar esta tarea? No se puede deshacer.')) return; store.all('comentario').filter(c => c.tareaId === el.dataset.id).forEach(c => store.remove(c.id)); store.remove(el.dataset.id); ui.tarea = null; },
  irOrigen(el) {
    const t = P(el.dataset.id), o = t.origen || {}, r = P(o.id); ui.tarea = null;
    if (o.tipo === 'nota' && r) location.hash = '#/reunion/' + r.reunionId;
    else if (o.tipo === 'pedido' && r) { ui.tab = r.estado; location.hash = '#/pedidos'; }
    else { aviso('Esta tarea nació como iniciativa interna.'); return; }
    render();
  },
  evaluar(el) { const p = P(el.dataset.id); p.estado = 'evaluacion'; store.save(p); },
  convertir(el) {
    const r = P(el.dataset.id), reu = r.tipo === 'nota' && P(r.reunionId);
    modalTarea('Crear tarea', { titulo: r.texto, campanaId: reu ? reu.campanaId : '' }, infoOrigen(r), d => { crearTarea({ ...d, origen: origenDe(r) }); marcarConvertido(r); aviso('Tarea creada y enlazada a su origen'); });
  },
  dividir(el) {
    const r = P(el.dataset.id);
    modal('Dividir en varias tareas', infoOrigen(r) + `<label class="fld">Una tarea por línea<textarea class="in" name="lineas" rows="5" required>${esc(r.texto)}</textarea></label>`, d => {
      const ls = d.lineas.split('\n').map(x => x.trim()).filter(Boolean); if (!ls.length) return false;
      ls.forEach(titulo => crearTarea({ titulo, origen: origenDe(r) })); marcarConvertido(r); aviso(ls.length + ' tareas creadas');
    }, 'Crear tareas');
  },
  descartar(el) {
    const r = P(el.dataset.id);
    if (r.tipo === 'nota') { r.estado = 'sin_accion'; store.save(r); return; }
    modal('Descartar pedido', `<label class="fld">Motivo<input class="in" name="motivo" required maxlength="200"></label>`, d => { r.estado = 'descartado'; r.motivo = d.motivo.trim(); store.save(r); }, 'Descartar');
  },
  reabrir(el) { const r = P(el.dataset.id); r.estado = r.tipo === 'nota' ? 'pendiente' : 'nuevo'; r.motivo = ''; store.save(r); },
  nuevaReunion() { formReunion(); },
  editarReunion(el) { formReunion(P(el.dataset.id)); },
  cerrarMinuta(el) { if (pendNotas(el.dataset.id)) return aviso('Quedan notas sin resolver.'); const r = P(el.dataset.id); r.estado = 'cerrada'; store.save(r); },
  reabrirMinuta(el) { const r = P(el.dataset.id); r.estado = 'borrador'; store.save(r); },
  borrarNota(el) { if (confirm('¿Borrar esta nota?')) store.remove(el.dataset.id); },
  moverNota(el) {
    const n = P(el.dataset.id), rs = store.all('reunion').filter(x => x.id !== n.reunionId && x.estado !== 'cerrada').sort((a, b) => a.fecha.localeCompare(b.fecha));
    modal('Pasar a otra reunión', `<label class="fld">Reunión<select class="in" name="rid">${opts(rs.map(r => [r.id, fFecha(r.fecha) + (r.motivo ? ' · ' + r.motivo : '')]))}</select></label>`, d => { n.reunionId = d.rid; store.save(n); }, 'Pasar');
  },
  persona(el) {
    const p = el.dataset.id ? P(el.dataset.id) : null;
    modal(p ? 'Editar persona' : 'Nueva persona', `<label class="fld">Nombre<input class="in" name="nombre" required maxlength="60" value="${esc(p ? p.nombre : '')}"></label>
<label class="fld">Mail<input class="in" type="email" name="email" value="${esc(p ? p.email || '' : '')}" placeholder="El mismo con el que ingresa"></label>
<div class="fld">Áreas<div>${store.all('area').sort(byNom).map(a => `<label class="chk"><input type="checkbox" name="areas" value="${a.id}"${p && (p.areas || []).includes(a.id) ? ' checked' : ''}>${esc(a.nombre)}</label>`).join('')}</div></div>`, (d, f) => {
      if (!d.nombre.trim()) return false;
      store.save({ ...(p || { tipo: 'persona' }), nombre: d.nombre.trim(), email: (d.email || '').trim().toLowerCase(), areas: new FormData(f).getAll('areas') });
    });
  },
  usarComo(el) { yo = P(el.dataset.id); localStorage.setItem(LS_YO, yo.id); render(); aviso('Ahora usás la app como ' + yo.nombre); },
  area(el) {
    const a = el.dataset.id ? P(el.dataset.id) : null;
    modal(a ? 'Editar área' : 'Nueva área', `<label class="fld">Nombre<input class="in" name="nombre" required maxlength="40" value="${esc(a ? a.nombre : '')}"></label>`, d => { if (!d.nombre.trim()) return false; store.save({ ...(a || { tipo: 'area' }), nombre: d.nombre.trim() }); });
  },
  campana(el) {
    const c = el.dataset.id ? P(el.dataset.id) : null;
    modal(c ? 'Editar campaña' : 'Nueva campaña', `<label class="fld">Nombre<input class="in" name="nombre" required maxlength="60" value="${esc(c ? c.nombre : '')}"></label>
<div class="g2"><label class="fld">Inicio<input class="in" type="date" name="inicio" value="${esc(c ? c.inicio || '' : '')}"></label><label class="fld">Fin<input class="in" type="date" name="fin" value="${esc(c ? c.fin || '' : '')}"></label></div>
<label class="fld">Estado<select class="in" name="estado">${opts([['activa', 'Activa'], ['cerrada', 'Cerrada']], c ? c.estado : 'activa')}</select></label>`, d => { if (!d.nombre.trim()) return false; store.save({ ...(c || { tipo: 'campana' }), nombre: d.nombre.trim(), inicio: d.inicio, fin: d.fin, estado: d.estado }); });
  },
  exportar() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify([...store.recs.values()], null, 1)], { type: 'application/json' }));
    a.download = 'gestion-' + CONFIG.CLIENTE.toLowerCase() + '-' + hoy() + '.json'; a.click();
  },
  async salir() { await sb.auth.signOut(); location.reload(); },
  async google() { const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } }); if (error) aviso(error.message); }
};
function formReunion(r) {
  const ps = store.all('persona').sort(byNom);
  modal(r ? 'Editar reunión' : 'Nueva reunión', `<div class="g2"><label class="fld">Fecha<input class="in" type="date" name="fecha" required value="${esc(r ? r.fecha : hoy())}"></label>
<label class="fld">Campaña<select class="in" name="campanaId">${opts(campO(r && r.campanaId), r && r.campanaId, 'Sin campaña')}</select></label></div>
<label class="fld">Motivo<input class="in" name="motivo" maxlength="80" value="${esc(r ? r.motivo || '' : '')}" placeholder="Ej.: Planificación del mes"></label>
<div class="fld">Participantes<div>${ps.map(p => `<label class="chk"><input type="checkbox" name="part" value="${p.id}"${(r ? (r.participantes || []).includes(p.id) : true) ? ' checked' : ''}>${esc(p.nombre)}</label>`).join('')}</div></div>`, (d, f) => {
    if (!d.fecha) return false;
    const n = store.save({ ...(r || { tipo: 'reunion', estado: 'borrador', creado: ahora() }), fecha: d.fecha, motivo: d.motivo.trim(), campanaId: d.campanaId, participantes: new FormData(f).getAll('part') });
    if (!r) location.hash = '#/reunion/' + n.id;
  });
}

const ETIQ = { areaId: 'el área', prioridad: 'la prioridad', vence: 'el vencimiento', campanaId: 'la campaña', descripcion: 'la descripción', titulo: 'el título' };
const cambios = {
  estado(el) { cambiarEstado(P(el.dataset.id), el.value); programar(); },
  campo(el) {
    const t = P(el.dataset.id), k = el.dataset.k, v = el.value;
    if (!t || t[k] === v) return;
    if (k === 'titulo' && !v.trim()) return programar();
    if (k === 'responsableId') {
      if (!v && t.estado !== 'pendiente' && t.estado !== 'completada') { aviso('Una tarea en curso necesita responsable.'); return programar(); }
      t.responsableId = v; t.colaboradores = (t.colaboradores || []).filter(x => x !== v); store.save(t);
      return log(t, v ? `asignó a ${nom(v)} como responsable` : 'quitó al responsable');
    }
    t[k] = k === 'titulo' ? v.trim() : v; store.save(t); log(t, 'cambió ' + ETIQ[k]);
  },
  colab(el) { const t = P(el.dataset.id), s = new Set(t.colaboradores || []); el.checked ? s.add(el.value) : s.delete(el.value); t.colaboradores = [...s]; store.save(t); },
  filtro(el) { ui.f[el.dataset.k] = el.value; render(); },
  grupo(el) { ui.grupo = el.value; render(); },
  buscar(el) { ui.q = el.value.trim(); render(); },
  importar(el) {
    const file = el.files[0]; if (!file) return;
    const fr = new FileReader();
    fr.onload = () => { try { const l = JSON.parse(fr.result); if (!Array.isArray(l)) throw 0; if (!confirm(`Se van a importar ${l.length} registros. ¿Seguimos?`)) return; l.filter(r => r && r.id && r.tipo).forEach(r => store.save(r)); aviso('Datos importados'); } catch (e) { aviso('El archivo no es una copia válida.'); } };
    fr.readAsText(file);
  }
};
const envios = {
  pedido(f) { const texto = f.elements.texto.value.trim(); if (!texto) return; store.save({ tipo: 'pedido', texto, origenTipo: f.elements.origen.value, estado: 'nuevo', cargadoPor: yo.id, creado: ahora() }); ui.tab = 'nuevo'; ui.foco = '#nuevo-pedido'; },
  nota(f) { const texto = f.elements.texto.value.trim(); if (!texto) return; store.save({ tipo: 'nota', reunionId: f.dataset.r, clase: f.dataset.t, texto, autor: yo.id, estado: 'pendiente', creado: ahora() }); ui.foco = `form[data-s="nota"][data-t="${f.dataset.t}"] input`; },
  comentario(f) { const texto = f.elements.texto.value.trim(); if (!texto) return; store.save({ tipo: 'comentario', tareaId: f.dataset.id, autor: yo.id, fecha: ahora(), texto, auto: false }); ui.foco = '#coment'; }
};

document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && acc[el.dataset.a]) acc[el.dataset.a](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && cambios[el.dataset.c]) cambios[el.dataset.c](el); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-s]'); if (f) { e.preventDefault(); envios[f.dataset.s](f); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').innerHTML) cerrarModal(); else if (ui.tarea) { ui.tarea = null; render(); } }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('kc')) { ui.tarea = e.target.dataset.id; render(); }
});
document.addEventListener('focusout', () => { if (pend) setTimeout(() => { if (pend) render(true); }, 60); });
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.kc'); if (c) e.dataTransfer.setData('text/plain', c.dataset.id); });
document.addEventListener('dragover', e => { if (e.target.closest && e.target.closest('.kcol')) e.preventDefault(); });
document.addEventListener('drop', e => { const c = e.target.closest && e.target.closest('.kcol'); if (!c) return; e.preventDefault(); cambiarEstado(P(e.dataTransfer.getData('text/plain')), c.dataset.e); });
window.addEventListener('hashchange', () => { ui.tarea = null; render(); window.scrollTo(0, 0); });
window.addEventListener('storage', async e => { if (!NUBE && e.key === LS && yo) { store.recs = new Map((await local.load()).map(r => [r.id, r])); render(true); } });

/* ---------- arranque ---------- */
function pantalla(html) { $('#app').innerHTML = `<div class="login"><div class="md" style="width:min(420px,100%)"><div class="logo" style="padding:0">${esc(CONFIG.CLIENTE)}</div>${html}</div></div>`; }
function sembrar() { if (!store.all('area').length) ['Diseño', 'Audiovisual', 'Media', 'Contenido orgánico'].forEach(nombre => store.save({ tipo: 'area', nombre })); }
function cargarScript(src) { return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); }); }

async function iniciar() {
  try {
    if (NUBE) {
      await cargarScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
      sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {});
      sesion = (await sb.auth.getSession()).data.session;
      if (!sesion) {
        pantalla(`<h2 style="font-size:18px">Plataforma de gestión</h2><form class="col" id="ingreso" style="width:100%"><label class="fld">Mail<input class="in" type="email" name="email" required autocomplete="username"></label><label class="fld">Contraseña<input class="in" type="password" name="clave" required autocomplete="current-password"></label><p class="err" id="ingreso-err" hidden></p><button class="btn">Ingresar</button></form>`);
        $('#ingreso').onsubmit = async e => {
          e.preventDefault(); const f = e.target, b = f.querySelector('button'); b.disabled = true;
          const { error } = await sb.auth.signInWithPassword({ email: f.elements.email.value.trim(), password: f.elements.clave.value });
          if (error) { b.disabled = false; const m = $('#ingreso-err'); m.hidden = false; m.textContent = 'Mail o contraseña incorrectos.'; return; }
          location.reload();
        };
        return;
      }
      const mail = (sesion.user.email || '').toLowerCase();
      const hab = await sb.from('permitidos').select('email');
      if (hab.error) throw hab.error;
      if (!hab.data.length) return pantalla(`<h2 style="font-size:18px">Tu cuenta no está habilitada</h2><p class="mut">${esc(mail)} no figura en la lista del equipo. Pedile a quien administra la plataforma que te sume.</p><button type="button" class="btn sec" data-a="salir">Salir</button>`);
      store.recs = new Map((await nube.load()).map(r => [r.id, r]));
      yo = store.all('persona').find(p => (p.email || '').toLowerCase() === mail);
      const meta = sesion.user.user_metadata || {};
      if (!yo) { yo = { tipo: 'persona', id: uid(), nombre: meta.full_name || meta.name || mail.split('@')[0], email: mail, areas: [] }; store.save(yo); }
      sembrar(); nube.escuchar(); render();
    } else {
      store.recs = new Map((await local.load()).map(r => [r.id, r]));
      const ps = store.all('persona');
      yo = P(localStorage.getItem(LS_YO)) || ps[0] || null;
      if (yo) { sembrar(); return render(); }
      pantalla(`<h2 style="font-size:18px">Bienvenida a la plataforma</h2><p class="mut">Está en modo local: los datos se guardan solo en este navegador. Para compartirlos con el equipo hay que conectar Supabase (ver README).</p>
<form class="col" id="alta"><label class="fld">¿Cómo te llamás?<input class="in" name="nombre" required maxlength="60"></label><button class="btn">Empezar</button></form>`);
      $('#alta').onsubmit = e => {
        e.preventDefault(); const nombre = e.target.elements.nombre.value.trim(); if (!nombre) return;
        yo = { tipo: 'persona', id: uid(), nombre, email: '', areas: [] }; store.save(yo); localStorage.setItem(LS_YO, yo.id); sembrar(); render();
      };
    }
  } catch (e) {
    pantalla(`<h2 style="font-size:18px">No se pudo iniciar</h2><p class="err">${esc(e.message || e)}</p><p class="mut">Revisá los datos de CONFIG y que hayas corrido el archivo supabase.sql.</p>`);
  }
}
iniciar();
</script>
</body>
</html>
